<!DOCTYPE html>
<html>
<head>
    <title>Ella Vr</title>

</head>

<body>
<a-scene>
    <a-assets>
        <img id="wall" src="imges/wall.jpg" title="imges by nothing ahead found on cavna" preload="auto">
        <img id="dog" src="imges/dog.jpg" title="imges by nothing ahead found on cavna" preload="auto">
        <img id="duck" src="imges/duck.jpg" title="imges by nothing ahead found on cavna" preload="auto">
    </a-assets>

<a-entity environment="preset:forest; dressingAmount: 5000;skyColor:#F39C6B;"></a-entity>

<!-- Museum floor starts here -->
 <a-cylinder id="floor" position="0 0 0" radius="7.5" color="white" height="0.1"></a-cylinder>
<a-box id="wall1" position="0 1.473 4.907 "rotation="0 0 0" scale="10 3 0.2" src="#wall"></a-box>
<a-box id="wall2" position="0 1.473 -4.907" rotation="0 0 0" scale="10 3 0.2" src="#wall"></a-box>
<a-box id="wall3" position="5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2"src="#wall"></a-box>
<a-box id="wall4" position="-5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" src="#wall"></a-box>
<a-cylinder id="triangle_front" segments-radial="3" position="0 3.874 4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="white"></a-cylinder>
<a-cylinder id="triangle_back" segments-radial="3" position="0 3.874 -4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="white"></a-cylinder>
<a-box id="roof_right" position="2.580 4.328 0" rotation="28.433 90 0" scale="10.931 0.20 6.110" color="#000500"></a-box>
<a-box id="roof_left" position="-2.599 4.321 -0.017" rotation="28.433 -90 0" scale="10.931 0.20 6.130" color="#000500"></a-box>





<a-plane id="art1" src="#dog" scale="2 2 0.05" rotation="0 0 0" position="-0.162 1.934 -4.792"></a-plane>



<a-plane id="art1" src="#duck" scale="2 2 0.05" rotation="0 0 0" position="-2.390 1.934 -4.792"></a-plane>

</a-scene>
